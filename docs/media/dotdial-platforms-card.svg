<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DotDial — Linux beta and macOS preview</title>
  <desc id="desc">Call your existing ChatGPT dot from the menu bar, tray or global hotkey. macOS Preview 1 is available for Apple Silicon and Intel. Optional local English wake detection is off by default. Saved replies and a 1997 modem handshake. The Mac preview is ad-hoc signed, not notarized, and still awaits hands-on Mac acceptance. Unofficial open-source MIT project. No app screenshot or live-call demonstration is shown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c151e"/><stop offset="1" stop-color="#070d14"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6bdcbe" stop-opacity=".13"/><stop offset="1" stop-color="#6bdcbe" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="1055" cy="160" rx="460" ry="430" fill="url(#glow)"/>
  <circle cx="1210" cy="190" r="255" fill="none" stroke="#7de0bb" stroke-opacity=".05"/>
  <circle cx="1210" cy="190" r="335" fill="none" stroke="#7de0bb" stroke-opacity=".035"/>

  <image x="51" y="30" width="48" height="48" xlink:href="data:image/svg+xml;base64,"/>
  <text x="110" y="65" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#f4f7fb" >DotDial</text>
  <text x="1150" y="60" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#91aeba" text-anchor="end" letter-spacing="1.2">OPEN SOURCE · MIT</text>

  <rect x="56" y="100" width="475" height="42" rx="21" fill="#16362e" stroke="#28574a"/>
  <circle cx="78" cy="121" r="4" fill="#7de0bb"/>
  <text x="94" y="129" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#a3f0d3" >Linux beta · macOS preview</text>

  <text x="56" y="216" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="700" fill="#f6fbff" >Your dot.</text>
  <text x="56" y="284" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="700" fill="#7de0bb" >One shortcut away.</text>
  <text x="58" y="330" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#d2e1e9" >Call from the menu bar or tray.</text>
  <text x="58" y="365" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a9c2cf" >Your existing ChatGPT dot. No API key.</text>

  <line x1="790" y1="182" x2="790" y2="365" stroke="#345d53"/>
  <text x="826" y="221" font-family="DejaVu Sans, sans-serif" font-size="41" font-weight="700" fill="#f1f9f7" >macOS</text>
  <text x="828" y="250" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#7de0bb" letter-spacing="2.6">PREVIEW 1</text>
  <text x="828" y="293" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#d4e7e7" >Apple Silicon + Intel</text>
  <text x="828" y="325" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#abc7cf" >DMG + .app ZIP</text>
  <text x="828" y="356" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#abc7cf" >Command–Shift–Space</text>

  <line x1="56" y1="389" x2="1150" y2="389" stroke="#263d43"/>
  <text x="58" y="414" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#88adac" letter-spacing="1.6">OPTIONAL WAKE WORD</text>
  <text x="58" y="452" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#e7f5f4" >Local “Hey Dot”</text>
  <text x="58" y="481" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#a6becb" >English · off by default</text>
  <text x="432" y="414" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#88adac" letter-spacing="1.6">LISTEN LATER</text>
  <text x="432" y="452" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#e7f5f4" >Saved replies</text>
  <text x="432" y="481" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#a6becb" >Optional local recording</text>
  <text x="805" y="414" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#88adac" letter-spacing="1.6">A LITTLE 1997</text>
  <text x="805" y="452" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#e7f5f4" >Modem handshake</text>
  <text x="805" y="481" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#a6becb" >A real dial-up connection sound</text>

  <text x="58" y="531" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#b1c5d1" >Mac preview: ad-hoc signed · not notarized · hands-on Mac testing pending.</text>
  <line x1="56" y1="552" x2="1150" y2="552" stroke="#263440"/>
  <text x="56" y="590" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#dcf9ee" >github.com/aaamosh/DotDial</text>
  <text x="1150" y="589" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#a0b9c9" text-anchor="end">Existing dot access required · Unofficial community project</text>
</svg>
