name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like DotDial to do?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and scope
      options:
        - label: This request does not require sharing credentials, browser profiles, private account details, or call recordings.
          required: true
