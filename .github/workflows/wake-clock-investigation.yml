name: Temporary wake clock comparison

# Diagnostic evidence only. This workflow neither publishes nor accepts builds.
on:
  push:
    branches: [diagnostics/wake-clock]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare wake clocks on macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      TMPDIR: /tmp
      DOTDIAL_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out the diagnostic source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Set up native Python
        id: wake-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/wake-requirements.txt
      - name: Install pinned project dependencies
        run: npm ci
      - name: Prepare one shared managed wake environment and model
        env:
          WAKE_PYTHON: ${{ steps.wake-python.outputs.python-path }}
        run: '"$WAKE_PYTHON" scripts/setup-wake.py --data-dir "$RUNNER_TEMP/dotdial-wake-clock-data" --stdin-audio'
      - name: Compare three clocks with the unchanged pipeline smoke
        run: node scripts/compare-wake-clocks.cjs --data-dir "$RUNNER_TEMP/dotdial-wake-clock-data" --output-dir build/wake-clock-comparison
      - name: Preserve every raw smoke report and comparison status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wake-clock-${{ matrix.arch }}-${{ github.sha }}
          path: build/wake-clock-comparison/
          if-no-files-found: error
          retention-days: 14
