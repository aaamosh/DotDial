<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- macOS application icon: the DotDial mark on a dark rounded tile. -->
  <rect x="2" y="2" width="92" height="92" rx="21" fill="#132B3A"/>
  <defs>
    <linearGradient id="g" x1="16" y1="15" x2="80" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8FFE1"/>
      <stop offset=".48" stop-color="#69DDB4"/>
      <stop offset="1" stop-color="#769BFF"/>
    </linearGradient>
    <radialGradient id="r" cx="0" cy="0" r="1" gradientTransform="matrix(0 34 -34 0 42 32)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7FFF5" stop-opacity=".34"/>
      <stop offset="1" stop-color="#83DDBA" stop-opacity=".03"/>
    </radialGradient>
  </defs>
  <circle cx="48" cy="48" r="37" stroke="url(#g)" stroke-width="2" opacity=".88"/>
  <ellipse cx="48" cy="48" rx="29" ry="15" stroke="#8FDCC7" stroke-opacity=".45" transform="rotate(-31 48 48)"/>
  <ellipse cx="48" cy="48" rx="15" ry="29" stroke="#A9B4FF" stroke-opacity=".4" transform="rotate(29 48 48)"/>
  <circle cx="48" cy="48" r="23" fill="url(#r)" stroke="#D0F5E5" stroke-opacity=".28"/>
  <circle cx="48" cy="48" r="7.5" fill="url(#g)"/>
  <circle cx="48" cy="48" r="3" fill="#F0FFF8"/>
  <circle cx="75" cy="26" r="3" fill="#C2ACFF"/>
</svg>
